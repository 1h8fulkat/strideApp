# STRIDE — the helpers and rollups the scripts expect to find.
#
# Copy this file to your Home Assistant config as `packages/stride.yaml`, and
# make sure `configuration.yaml` includes packages:
#
#     homeassistant:
#       packages: !include_dir_named packages
#
# Then restart Home Assistant.
#
# None of this is needed to use the treadmill — the console shows up in Home
# Assistant on its own. This is for the things that need accumulated history:
# the coach knowing what you did this week, and the reminders knowing when you
# last weighed in.
#
# The console's distance counter resets at the start of every walk, which is
# right for a session and no use for "how far this week", so the accumulating
# happens here.

# --- accumulate the session counter into real periods ----------------------
#
# utility_meter handles a source that climbs then resets, which is exactly what
# a per-session counter does.
#
# If you renamed the treadmill device in Home Assistant, change the sources
# below to match and set `treadmill_prefix` in stride.conf to the same thing.
utility_meter:
  treadmill_distance_daily:
    source: sensor.treadmill_distance
    cycle: daily
  treadmill_distance_weekly:
    source: sensor.treadmill_distance
    cycle: weekly
  treadmill_distance_monthly:
    source: sensor.treadmill_distance
    cycle: monthly
  treadmill_calories_weekly:
    source: sensor.treadmill_calories
    cycle: weekly

# --- how many walks this week, and how long ---------------------------------
#
# Derived from history rather than counted by automations - nothing to
# increment, nothing to reset on a Monday, nothing to drift across a restart.
#
# A walk counts when the console reaches its summary screen.
sensor:
  - platform: history_stats
    name: Treadmill workouts this week
    entity_id: sensor.treadmill_mode
    state: summary
    type: count
    start: >-
      {{ (now() - timedelta(days=now().weekday())).replace(
           hour=0, minute=0, second=0, microsecond=0) }}
    end: "{{ now() }}"

  - platform: history_stats
    name: Treadmill time walked this week
    entity_id: sensor.treadmill_mode
    state: running
    type: time
    start: >-
      {{ (now() - timedelta(days=now().weekday())).replace(
           hour=0, minute=0, second=0, microsecond=0) }}
    end: "{{ now() }}"

# --- when things last happened ---------------------------------------------
#
# Stamped by the reminder automations, not typed in.
input_datetime:
  stride_last_weigh_in:
    name: Last weigh-in
    has_date: true
    has_time: true
  stride_last_bp:
    name: Last blood pressure reading
    has_date: true
    has_time: true
  stride_weigh_in_time:
    name: Weigh-in reminder time
    has_date: false
    has_time: true
  stride_bp_time:
    name: Blood pressure reminder time
    has_date: false
    has_time: true

# --- how the coach speaks ---------------------------------------------------
#
# Read when the coach writes a line, so a change applies to the next one.
input_select:
  stride_coach_personality:
    name: Coach personality
    options:
      - Supportive Friend
      - Drill Sergeant
      - Data Nerd
      - Zen Master
    initial: Supportive Friend
    icon: mdi:account-voice
